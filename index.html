<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minesweeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg1:#ffd6ec;--bg2:#b4c0ff;--ink:#2a1f6b;--slab:#5446d6;--edge:#2c2394;--pit:#241f5c;--top:#8fa0ff;--top2:#9fadff;--side:#5663e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2d1c6e;--bg2:#0e0b2c;--ink:#e9e7ff;--slab:#3a33a0;--edge:#16124a}}
:root[data-theme="dark"]{--bg1:#2d1c6e;--bg2:#0e0b2c;--ink:#e9e7ff;--slab:#3a33a0;--edge:#16124a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Fredoka,"Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2)) fixed;overflow-x:hidden;touch-action:manipulation;-webkit-touch-callout:none}
main{width:100%;max-width:980px;margin:0 auto;padding:16px 14px 30px;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{margin:4px 0 0;font-size:clamp(34px,9vw,54px);line-height:1;color:#fff;text-shadow:1px 1px 0 var(--edge),2px 2px 0 var(--edge),3px 3px 0 var(--edge),4px 4px 0 var(--edge),5px 5px 0 var(--edge),6px 10px 14px rgba(0,0,0,.3)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:16px;padding:9px 16px;margin-bottom:5px;color:#fff;background:var(--top);box-shadow:0 5px 0 var(--side),0 9px 14px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4);cursor:pointer;transition:transform .12s cubic-bezier(.3,1.9,.5,1),box-shadow .12s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--side),0 3px 6px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.on{background:#ffd23f;color:#3a2a00;--side:#d99a00}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:520px}
.lcd{min-width:96px;text-align:center;font-size:clamp(28px,8vw,40px);font-weight:700;line-height:1;padding:9px 12px;margin-bottom:4px;border-radius:18px;background:var(--pit);color:#ffd23f;letter-spacing:2px;font-variant-numeric:tabular-nums;box-shadow:inset 0 4px 8px rgba(0,0,0,.55),0 4px 0 var(--edge);text-shadow:1px 1px 0 #b87d00,2px 2px 0 #b87d00,3px 3px 0 #8f5f00,4px 6px 8px rgba(0,0,0,.5)}
#face{width:70px;height:70px;padding:0;border-radius:50%;background:#ffd23f;--side:#d99a00;display:grid;place-items:center}
#msg{margin:0;min-height:1.5em;font-weight:600;font-size:18px;text-align:center}
.hint{margin:0;font-size:14px;opacity:.85;text-align:center;max-width:460px}
.stage{width:100%;overflow-x:auto;padding:22px 10px 44px;perspective:1000px;-webkit-overflow-scrolling:touch}
.tilt{width:max-content;margin:0 auto;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s cubic-bezier(.2,.9,.3,1.3);transform-style:preserve-3d}
.board{display:grid;grid-template-columns:repeat(var(--c),var(--s));gap:calc(var(--s)*.1);padding:calc(var(--s)*.35);border-radius:28px;background:var(--slab);box-shadow:0 14px 0 var(--edge),0 34px 46px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.28);animation:wob 7s ease-in-out infinite;user-select:none;-webkit-user-select:none}
@keyframes wob{0%,100%{transform:rotateX(2.2deg) rotateZ(-.4deg)}50%{transform:rotateX(-1.2deg) rotateZ(.4deg)}}
.t{width:var(--s);height:var(--s);position:relative;-webkit-tap-highlight-color:transparent}
.f{position:absolute;inset:0;border-radius:calc(var(--s)*.3);background:var(--top);display:grid;place-items:center;font-weight:700;font-size:calc(var(--s)*.62);line-height:1;box-shadow:0 calc(var(--s)*.14) 0 var(--side),0 calc(var(--s)*.2) calc(var(--s)*.18) rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .14s cubic-bezier(.3,1.9,.5,1),box-shadow .14s,background .2s}
.t.alt .f{background:var(--top2)}
.f svg{width:70%;height:70%;pointer-events:none}
.t.dn .f{transform:translateY(calc(var(--s)*.1));box-shadow:0 calc(var(--s)*.04) 0 var(--side),0 calc(var(--s)*.06) calc(var(--s)*.08) rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.4)}
.t.fl .f svg{animation:plant .4s cubic-bezier(.3,1.9,.5,1)}
@keyframes plant{from{transform:translateY(-130%) scale(.4) rotate(-25deg)}}
.q b{color:#fff}
.t.r .f{background:var(--pit);transform:translateY(calc(var(--s)*.12));box-shadow:inset 0 calc(var(--s)*.07) calc(var(--s)*.08) rgba(0,0,0,.55);animation:drop .4s cubic-bezier(.3,1.5,.5,1) calc(var(--d,0)*26ms) backwards}
@keyframes drop{0%{background:var(--top);transform:translateY(0);box-shadow:0 calc(var(--s)*.14) 0 var(--side)}35%{background:var(--top);transform:translateY(calc(var(--s)*-.3)) scale(1.1);box-shadow:0 calc(var(--s)*.42) 0 var(--side)}}
.f b{color:var(--nc);text-shadow:0 calc(var(--s)*.05) 0 rgba(0,0,0,.5);animation:pip .32s cubic-bezier(.3,1.9,.5,1) calc(var(--d,0)*26ms + 140ms) backwards}
@keyframes pip{from{opacity:0;transform:scale(.2)}}
.n1{--nc:#4cc9ff}.n2{--nc:#3ddc84}.n3{--nc:#ff5d73}.n4{--nc:#b79bff}.n5{--nc:#ffb020}.n6{--nc:#2ee6d6}.n7{--nc:#ff8ad8}.n8{--nc:#fff}
.t.m .f{background:#3b2478}
.t.x .f::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--s)*.8);color:#1a1440}
.t.hit .f{background:#ff5d73;animation:hit .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hit{0%{transform:translateY(calc(var(--s)*-.5)) scale(1.7)}}
.t.no .f{animation:no .3s}
@keyframes no{25%{transform:translate(-4px,calc(var(--s)*.12))}75%{transform:translate(4px,calc(var(--s)*.12))}}
main.shake{animation:shake .6s}
@keyframes shake{15%{transform:translate(-10px,4px) rotate(-.6deg)}30%{transform:translate(9px,-5px) rotate(.5deg)}45%{transform:translate(-7px,-3px)}60%{transform:translate(6px,4px)}80%{transform:translate(-3px,2px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:49;background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),rgba(255,255,255,.95),rgba(255,170,90,.6) 25%,transparent 60%)}
#flash.go{animation:fl .7s ease-out}
@keyframes fl{from{opacity:1}}
dialog{border:0;border-radius:26px;padding:22px;background:var(--slab);color:#fff;font-family:inherit;box-shadow:0 10px 0 var(--edge),0 30px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,10,60,.55);backdrop-filter:blur(4px)}
dialog h2{margin:0 0 14px;font-size:24px}
dialog label{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 0 12px;font-weight:600}
dialog input{width:84px;font:inherit;font-weight:600;padding:8px 10px;border:0;border-radius:12px;text-align:center;background:var(--pit);color:#ffd23f;box-shadow:inset 0 3px 6px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){.board,main.shake{animation:none}.t.r .f,.f b,.t.fl .f svg{animation:none}.tilt{transition:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="mine" viewBox="0 0 40 40"><g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M20 3v34M3 20h34M8 8l24 24M32 8L8 32"/></g><circle cx="20" cy="20" r="11" fill="#1a1440" stroke="#fff" stroke-width="2"/><circle cx="16" cy="16" r="3.5" fill="#fff"/></symbol>
<symbol id="flag" viewBox="0 0 40 40"><path d="M11 36V5" stroke="#3a2a00" stroke-width="4" stroke-linecap="round"/><path d="M13 6l20 8-20 9z" fill="#ff5d73" stroke="#ff5d73" stroke-width="3" stroke-linejoin="round"/><ellipse cx="11" cy="36" rx="9" ry="3" fill="#3a2a00"/></symbol>
</defs></svg>
<main id="main">
<h1>Minesweeper</h1>
<div class="row" id="lv"><button class="btn" data-l="b">Beginner</button><button class="btn" data-l="i">Intermediate</button><button class="btn" data-l="e">Expert</button><button class="btn" data-l="c">Custom</button></div>
<div class="hud"><div class="lcd" id="mc" role="status" aria-label="Mines left">010</div><button class="btn" id="face" aria-label="New game"></button><div class="lcd" id="tm" role="timer" aria-label="Seconds">000</div></div>
<p id="msg" aria-live="polite"></p>
<div class="stage"><div class="tilt" id="tilt"><div class="board" id="board"></div></div></div>
<div class="row"><button class="btn" id="fm">Flag mode</button><button class="btn" id="snd"></button><button class="btn" id="hap"></button><button class="btn" id="qm"></button></div>
<p class="hint">Right-click or long-press to flag. Tap a revealed number to clear around it.</p>
<p class="hint" id="best"></p>
</main>
<canvas id="fx"></canvas><div id="flash"></div>
<dialog id="dlg"><h2>Custom board</h2>
<label>Width (9–30)<input id="cw" type="number" min="9" max="30" value="16"></label>
<label>Height (9–24)<input id="ch" type="number" min="9" max="24" value="16"></label>
<label>Mines<input id="cm" type="number" min="1" max="600" value="40"></label>
<div class="row"><button class="btn" id="cx">Cancel</button><button class="btn on" id="cg">Start</button></div></dialog>
<script>
const $=s=>document.querySelector(s),LV={b:[9,9,10],i:[16,16,40],e:[16,30,99]},NAMES={b:'Beginner',i:'Intermediate',e:'Expert'};
const SC=[523,587,659,784,880,988,1175,1319,1568],SVG=n=>`<svg viewBox="0 0 40 40"><use href="#${n}"/></svg>`;
let G={},lvl='b',cust=[16,16,40],fmode=0,prefs={sound:1,haptic:1,q:0},bests={},AC,pd=null;
try{Object.assign(prefs,JSON.parse(localStorage.getItem('ms-prefs')||'{}'));bests=JSON.parse(localStorage.getItem('ms-best')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('ms-prefs',JSON.stringify(prefs));localStorage.setItem('ms-best',JSON.stringify(bests))}catch(e){}};
const B=$('#board'),T=$('#tilt'),M=$('#main'),F=$('#flash'),cv=$('#fx'),cx=cv.getContext('2d');
/* haptics: Vibration API where it exists, switch-input trick on iPhone */
const hl=document.createElement('label');hl.setAttribute('aria-hidden','true');hl.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:.01;pointer-events:none;overflow:hidden';hl.innerHTML='<input type="checkbox" switch>';document.body.appendChild(hl);
function vib(p){if(!prefs.haptic)return;if(navigator.vibrate){try{navigator.vibrate(p)}catch(e){}return}const a=[].concat(p);let t=0;a.forEach((v,k)=>{if(k%2===0)setTimeout(()=>{try{hl.click()}catch(e){}},t);t+=v})}
/* sound */
function initAudio(){if(!AC&&prefs.sound){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d=.18,type='sine',g=.12,to=0,at=0){if(!AC||!prefs.sound)return;const t=AC.currentTime+at,o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function boom(){if(!AC||!prefs.sound)return;const n=AC.sampleRate*1.1|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(2400,AC.currentTime);f.frequency.exponentialRampToValueAtTime(90,AC.currentTime+.9);const v=AC.createGain();v.gain.value=.9;s.connect(f).connect(v).connect(AC.destination);s.start();tone(110,.6,'sine',.5,28)}
/* particles */
let P=[],raf=0,dpr=1;
function fit(){dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
function burst(x,y,big=1){const n=big?90:14;for(let i=0;i<n;i++){const a=Math.random()*6.283,s=2+Math.random()*(big?9:5);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,dl:.012+Math.random()*.02,r:3+Math.random()*(big?7:4),c:['#ffd23f','#ff8a3d','#ff5d73','#fff'][i%4],g:.25})}
for(let i=0;i<(big?14:3);i++){const a=Math.random()*6.283,s=1+Math.random()*3;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,l:1,dl:.01,r:14+Math.random()*16,smoke:1,g:-.03})}
if(big)P.push({x,y,vx:0,vy:0,ring:1,l:1,r:10,dl:.03});run()}
function confetti(){for(let i=0;i<170;i++)P.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:Math.random()*4-2,vy:2+Math.random()*4,g:.06,l:1,dl:.003,conf:1,rot:0,vr:Math.random()*.4-.2,w:8+Math.random()*6,h:5+Math.random()*5,c:['#ffd23f','#ff5d73','#4cc9ff','#3ddc84','#b79bff'][i%5]});run()}
function run(){if(raf)return;const step=()=>{cx.clearRect(0,0,innerWidth,innerHeight);P=P.filter(p=>p.l>0);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;p.l-=p.dl;cx.globalAlpha=Math.max(p.l,0);
if(p.ring){p.r+=10;cx.strokeStyle='#fff';cx.lineWidth=8*p.l;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.stroke()}
else if(p.smoke){p.r+=.5;cx.fillStyle='rgba(50,40,90,.55)';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
else if(p.conf){p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
else{cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r*Math.max(p.l,.2),0,6.283);cx.fill()}}
cx.globalAlpha=1;if(P.length)raf=requestAnimationFrame(step);else{raf=0;cx.clearRect(0,0,innerWidth,innerHeight)}};raf=requestAnimationFrame(step)}
/* game */
const nb=i=>{const{r,c}=G,y=i/c|0,x=i%c,o=[];for(let dy=-1;dy<2;dy++)for(let dx=-1;dx<2;dx++){if(!dx&&!dy)continue;const Y=y+dy,X=x+dx;if(Y>=0&&Y<r&&X>=0&&X<c)o.push(Y*c+X)}return o};
function faceSVG(s){const e=s=='dead'?'<path d="M11 13l6 6M17 13l-6 6M23 13l6 6M29 13l-6 6"/>':s=='win'?'<path d="M6 14h28"/><rect x="7" y="12" width="11" height="8" rx="3" fill="#3a2a00"/><rect x="22" y="12" width="11" height="8" rx="3" fill="#3a2a00"/>':'<circle cx="14" cy="16" r="2.4" fill="#3a2a00"/><circle cx="26" cy="16" r="2.4" fill="#3a2a00"/>';
const m=s=='oh'?'<ellipse cx="20" cy="29" rx="3.5" ry="4.5" fill="#3a2a00"/>':`<path d="${s=='dead'?'M13 31q7-7 14 0':'M12 26q8 8 16 0'}"/>`;
return `<svg viewBox="0 0 40 40" width="46" height="46" fill="none" stroke="#3a2a00" stroke-width="3" stroke-linecap="round">${e}${m}</svg>`}
const setFace=s=>$('#face').innerHTML=faceSVG(s),msg=t=>$('#msg').textContent=t||'';
const pad=n=>n<0?'-'+String(Math.min(99,-n)).padStart(2,'0'):String(n).padStart(3,'0');
function hud(){$('#mc').textContent=pad(G.m-G.flags);$('#tm').textContent=pad(G.t||0)}
function sync(){document.querySelectorAll('#lv .btn').forEach(b=>b.classList.toggle('on',b.dataset.l===lvl));$('#fm').classList.toggle('on',!!fmode);
$('#snd').textContent='Sound '+(prefs.sound?'on':'off');$('#snd').classList.toggle('on',!!prefs.sound);
$('#hap').textContent='Haptics '+(prefs.haptic?'on':'off');$('#hap').classList.toggle('on',!!prefs.haptic);
$('#qm').textContent='? marks '+(prefs.q?'on':'off');$('#qm').classList.toggle('on',!!prefs.q);
$('#best').textContent='Best times: '+['b','i','e'].map(k=>NAMES[k]+' '+(bests[k]?bests[k]+' s':'none yet')).join(', ')}
function newGame(){clearInterval(G.tm);let[r,c,m]=lvl=='c'?cust:LV[lvl];if(c>r&&innerWidth<700&&innerWidth<innerHeight)[r,c]=[c,r];
G={r,c,m,n:r*c,mine:new Uint8Array(r*c),adj:new Uint8Array(r*c),st:new Uint8Array(r*c),started:0,over:0,flags:0,rev:0,t:0};
const W=Math.min(innerWidth-28,960);let s=Math.floor(Math.min(52,W/(c*1.1+.6),Math.max((innerHeight-340)/(r*1.1+.7),30)));s=Math.max(20,s);
B.style.setProperty('--s',s+'px');B.style.setProperty('--c',c);
B.innerHTML=Array.from({length:r*c},(_,i)=>`<div class="t${((i/c|0)+i%c)&1?' alt':''}" data-i="${i}"><div class="f"></div></div>`).join('');G.el=[...B.children];
setFace('ok');msg('');hud();sync()}
function place(s){const ex=new Set([s,...nb(s)]);if(G.n-ex.size<G.m){ex.clear();ex.add(s)}const pool=[];for(let i=0;i<G.n;i++)if(!ex.has(i))pool.push(i);
for(let k=0;k<G.m;k++){const j=k+Math.random()*(pool.length-k)|0;[pool[k],pool[j]]=[pool[j],pool[k]];G.mine[pool[k]]=1}
for(let i=0;i<G.n;i++)G.adj[i]=nb(i).reduce((a,j)=>a+G.mine[j],0)}
function show(i){const t=G.el[i],f=t.firstChild,s=G.st[i];t.classList.remove('dn','fl','q');if(s==2){t.classList.add('fl');f.innerHTML=SVG('flag')}else if(s==3){t.classList.add('q');f.innerHTML='<b>?</b>'}else f.innerHTML=''}
function paint(k,d){const t=G.el[k],a=G.adj[k];t.classList.remove('dn','fl','q');t.classList.add('r','n'+a);t.style.setProperty('--d',d);t.firstChild.innerHTML=a?`<b>${a}</b>`:''}
function tick(){G.t=Math.min(999,Math.floor((Date.now()-G.t0)/1000)+1);hud()}
function open(i){if(G.over||(G.st[i]!==0&&G.st[i]!==3))return;
if(!G.started){G.started=1;place(i);G.t0=Date.now();G.tm=setInterval(tick,250);tick()}
if(G.mine[i]){lose(i);return}
const q=[[i,0]],seen=new Set([i]);let h=0,cnt=0,md=0;
while(h<q.length){const[k,d]=q[h++];if(G.st[k]===2)continue;if(G.st[k]!==1){G.st[k]=1;G.rev++;cnt++;md=Math.max(md,d);paint(k,d)}
if(!G.adj[k])for(const j of nb(k))if(!seen.has(j)&&G.st[j]!==1){seen.add(j);q.push([j,d+1])}}
if(cnt>1)for(let z=0;z<=Math.min(7,md);z++)tone(SC[Math.min(8,z+1)],.22,'triangle',.1,0,z*.055);else tone(SC[G.adj[i]],.26,'sine',.16);
if(G.rev===G.n-G.m)win()}
function flag(i){if(G.over||G.st[i]===1)return;const s=G.st[i];G.st[i]=s===0?2:s===2?(prefs.q?3:0):0;G.flags=G.st.reduce((a,v)=>a+(v===2),0);show(i);hud();tone(200,.12,'triangle',.22,110);if(G.st[i]===2)tone(780,.08,'sine',.07,0,.05)}
function chord(i){if(G.st[i]!==1||!G.adj[i])return;const n=nb(i);if(n.filter(j=>G.st[j]===2).length!==G.adj[i]){const t=G.el[i];t.classList.remove('no');void t.offsetWidth;t.classList.add('no');tone(140,.15,'square',.05);return}
for(const j of n){if(G.over)break;if(G.st[j]===0||G.st[j]===3)open(j)}}
function shake(){M.classList.remove('shake');void M.offsetWidth;M.classList.add('shake')}
function lose(i){const g=G;g.over=1;clearInterval(g.tm);setFace('dead');msg('Boom. Tap the face to try again.');
const t=g.el[i];t.classList.add('hit','r','m');t.firstChild.innerHTML=SVG('mine');
const b=t.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2;
boom();vib([60,30,120,30,220]);burst(x,y);shake();F.style.setProperty('--fx',x+'px');F.style.setProperty('--fy',y+'px');F.classList.remove('go');void F.offsetWidth;F.classList.add('go');
const ms=[],cy=i/g.c|0,cxx=i%g.c,dist=k=>Math.hypot((k/g.c|0)-cy,k%g.c-cxx);
for(let k=0;k<g.n;k++){if(g.mine[k]&&k!==i&&g.st[k]!==2)ms.push(k);else if(g.st[k]===2&&!g.mine[k])g.el[k].classList.add('x')}
ms.sort((a,b)=>dist(a)-dist(b));const gap=Math.min(70,1500/(ms.length||1));
ms.forEach((k,n)=>setTimeout(()=>{if(G!==g)return;const e=g.el[k];e.classList.add('r','m');e.style.setProperty('--d',0);e.firstChild.innerHTML=SVG('mine');
if(n%3===0){const r=e.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,0);tone(170-Math.min(n,45)*2,.12,'triangle',.1,60)}},380+n*gap))}
function win(){G.over=1;clearInterval(G.tm);tick();setFace('win');
for(let k=0;k<G.n;k++)if(G.mine[k]&&G.st[k]!==2){G.st[k]=2;show(k)}G.flags=G.m;hud();
let nbst='';if(lvl!=='c'&&(!bests[lvl]||G.t<bests[lvl])){bests[lvl]=G.t;nbst=' New best.';save()}
msg(`Cleared in ${G.t} s.${nbst}`);sync();confetti();vib([40,40,40,40,160]);[523,659,784,1047].forEach((f,k)=>tone(f,.4,'triangle',.14,0,k*.11))}
/* input */
B.addEventListener('contextmenu',e=>e.preventDefault());
B.addEventListener('pointerdown',e=>{initAudio();const t=e.target.closest('.t');if(!t||G.over)return;const i=+t.dataset.i,mouse=e.pointerType==='mouse';
if(mouse&&e.button===2){flag(i);return}if(mouse&&e.button===1){e.preventDefault();chord(i);return}if(mouse&&e.button>0)return;
vib(12);if(G.st[i]!==1)t.classList.add('dn');setFace('oh');
const r=T.getBoundingClientRect();if(!mouse){T.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*7+'deg');T.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*7+'deg')}
pd={i,t,x:e.clientX,y:e.clientY,lp:0,mouse,timer:setTimeout(()=>{if(!pd)return;pd.lp=1;t.classList.remove('dn');vib(30);flag(i)},420)}});
function endPress(){if(!pd)return null;const p=pd;pd=null;clearTimeout(p.timer);p.t.classList.remove('dn');if(!G.over)setFace('ok');if(!p.mouse){T.style.setProperty('--rx','0deg');T.style.setProperty('--ry','0deg')}return p}
addEventListener('pointerup',()=>{const p=endPress();if(!p||p.lp||G.over)return;const i=p.i;if(G.st[i]===1)chord(i);else if(fmode)flag(i);else if(G.st[i]!==2)open(i)});
addEventListener('pointercancel',endPress);
addEventListener('pointermove',e=>{if(pd&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)>12)endPress();
if(e.pointerType==='mouse'){T.style.setProperty('--rx',-(e.clientY/innerHeight-.5)*10+'deg');T.style.setProperty('--ry',(e.clientX/innerWidth-.5)*12+'deg')}});
/* controls */
$('#face').onclick=()=>{initAudio();vib(15);tone(660,.12,'triangle',.12,990);newGame()};
$('#lv').onclick=e=>{const b=e.target.closest('.btn');if(!b)return;initAudio();vib(12);if(b.dataset.l==='c'){$('#dlg').showModal();return}lvl=b.dataset.l;newGame()};
$('#fm').onclick=()=>{fmode^=1;vib(12);sync()};
const tog=(id,k)=>$(id).onclick=()=>{prefs[k]^=1;save();initAudio();vib(12);tone(700,.1,'triangle',.12);sync()};tog('#snd','sound');tog('#hap','haptic');tog('#qm','q');
$('#cx').onclick=()=>$('#dlg').close();
$('#cg').onclick=()=>{const cl=(v,a,b)=>Math.max(a,Math.min(b,parseInt(v)||a)),c=cl($('#cw').value,9,30),r=cl($('#ch').value,9,24),m=cl($('#cm').value,1,Math.min(600,r*c-9));cust=[r,c,m];lvl='c';$('#dlg').close();newGame()};
let rt;addEventListener('resize',()=>{fit();clearTimeout(rt);rt=setTimeout(()=>{if(!G.started)newGame()},250)});
fit();newGame();
</script></body></html>
